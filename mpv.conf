# General #
ontop
pause
border=yes
osc=no
osd-on-seek=no
#osd-scale-by-window=yes
osd-bar-h=1.3
osd-bar-w=30
osd-bar-align-x=0
osd-bar-align-y=-0.990
osd-border-size=2.3
osd-blur=0.1
osd-border-color=0.15/0.15/0.15
osd-align-x=center
osd-font-size=20
osd-duration=2000
cursor-autohide=3500
geometry=100%:100%
force-window=immediate
autofit-larger=35%x35%
keep-open=yes
hr-seek=no
hr-seek-framedrop=no
correct-pts=no

# Internet #
#ytdl-format=(bv*[vcodec~=vp9][fps>=50][width>720][width<2560]+ba*) / (bv*+ba*)
watch-later-options=start,volume
watch-later-directory=~/.config/mpv/watch_later/
reset-on-next-file=all
ignore-path-in-watch-later-config
save-position-on-quit
cache=yes
cache-on-disk=no
cache-pause=no
demuxer-hysteresis-secs=120
cache-pause-initial=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=500MiB
demuxer-donate-buffer=no

# Subtitles #
profile=sub-box
sub-font='IBM Plex Sans Medium'
sub-font-size=34
sub-ass-override=no
secondary-sub-ass-override=no
sub-ass-style-overrides=MarginV=0
sub-pos=85
sub-bold=yes
sub-margin-y=0
sub-margin-x=300
sub-blur=0.1
sub-auto=all
slang=ru,rus,en,eng,de,deu
alang=en,eng,ja,jp,jpn,rus,de,deu

# Audio #
volume-max=200

# Video #
profile=high-quality
hwdec=auto
vo=gpu-next
scale=bilinear
dscale=bilinear
correct-downscaling=no
deinterlace=auto
framedrop=no
vulkan-queue-count=2
vd-lavc-dr=yes
video-sync=display-resample
interpolation
tscale=sphinx
tscale-radius=2.45902403
tscale-blur=0.5
tscale-clamp=0.5
